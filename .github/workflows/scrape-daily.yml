name: Quét Dự Thảo Văn Bản Hàng Ngày

on:
  schedule:
    - cron: '0 1 * * *'      # Chạy lúc 8h sáng giờ Việt Nam (UTC+7)
  workflow_dispatch:         # Cho phép chạy thủ công

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl beautifulsoup4 requests
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper_du_thao.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload báo cáo
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-du-thao
          path: bao_cao_du_thao_moi_*.xlsx
