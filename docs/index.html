<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tra cứu dự thảo văn bản</title>
<style>*{box-sizing:border-box}body{max-width:1040px;margin:auto;padding:4vw;font:16px/1.6 system-ui;background:#f5f8fa;color:#183846}h1{font-size:clamp(28px,5vw,48px)}input,select,button{font:inherit;padding:.55em;max-width:100%;margin:.3em}article{background:white;border-bottom:1px solid #ccd8dc;padding:1em}small{display:block;color:#496475}a{color:#005e70}</style>
<main><h1>Tra cứu dự thảo văn bản</h1><input id="query" type="search" aria-label="Tìm tên văn bản" placeholder="Tìm tên văn bản"><select id="province" aria-label="Lọc tỉnh"><option value="">Tất cả tỉnh, thành</option></select><button id="reload">Tải lại dữ liệu</button><p id="status" role="status"></p><section id="results"></section><button id="more" hidden>Xem thêm</button></main>
<script>
const byId = id => document.getElementById(id);
const normalize = text => String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replaceAll('đ','d');
let documents = [], limit = 100;
function render() {
  const matches = documents.filter(row => (!province.value || row.tinh === province.value) && normalize(row.tieuDe).includes(normalize(query.value.trim())));
  results.replaceChildren();
  for (const row of matches.slice(0, limit)) {
    const card = document.createElement('article');
    const meta = document.createElement('small');
    meta.textContent = [row.tinh,row.ngay].filter(Boolean).join(' · ');
    const title = document.createElement(/^https?:\/\//i.test(row.linkTrang) ? 'a' : 'span');
    if (title.tagName === 'A') title.href = row.linkTrang;
    title.textContent = row.tieuDe;
    card.append(meta,title);
    results.append(card);
  }
  byId('status').textContent = matches.length + ' văn bản';
  more.hidden = matches.length <= limit;
}
async function refresh() {
  reload.disabled = true;
  byId('status').textContent = 'Đang tải văn bản từ Apps Script…';
  try {
    const response = await fetch('https://script.google.com/macros/s/AKfycbwU2Q885LjgO-t2sBxZFEfX7Ns9GY8lC7nquIBJIVJPe33SgO1BFwAZuqejuFe-cdZ3/exec?view=documents',{cache:'no-store'});
    const data = await response.json();
    if (!response.ok || !Array.isArray(data)) throw Error();
    documents = data;
    const selected = province.value;
    province.replaceChildren(new Option('Tất cả tỉnh, thành',''));
    for (const name of [...new Set(data.map(row=>row.tinh).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'))) province.add(new Option(name,name));
    province.value = selected;
    limit = 100;
    render();
  } catch { byId('status').textContent = 'Chưa tải được văn bản. Bạn hãy bấm Tải lại dữ liệu.'; }
  finally { reload.disabled = false; }
}
query.oninput = province.onchange = () => {limit = 100; render();};
more.onclick = () => {limit += 100; render();};
reload.onclick = refresh;
refresh();
</script></html>
